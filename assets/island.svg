<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 160">
  <defs>
    <linearGradient id="isl-grass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a8e187"/>
      <stop offset="0.55" stop-color="#63bd72"/>
      <stop offset="1" stop-color="#3f9a55"/>
    </linearGradient>
    <linearGradient id="isl-rock" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#a2745a"/>
      <stop offset="0.55" stop-color="#8a5f45"/>
      <stop offset="1" stop-color="#66452e"/>
    </linearGradient>
    <linearGradient id="isl-leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7ecf86"/>
      <stop offset="1" stop-color="#2f8a4c"/>
    </linearGradient>
    <linearGradient id="isl-fall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e6f5ff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#a8d8f5" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="isl-roof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f07628"/>
      <stop offset="1" stop-color="#c2511d"/>
    </linearGradient>
  </defs>

  <!-- rocky underside: faceted silhouette tapering to a point -->
  <path d="M18 62 L182 62 L170 78 L152 88 L130 97 L114 112 L105 128 L100 148 L93 126 L84 109 L68 97 L46 88 L28 76 Z" fill="url(#isl-rock)"/>
  <!-- lit top-left facet / shaded right facet -->
  <path d="M18 62 L84 62 L92 78 L72 96 L48 88 L28 76 Z" fill="#c49b74" opacity="0.55"/>
  <path d="M182 62 L170 78 L152 88 L130 97 L114 112 L118 96 L134 84 L152 74 Z" fill="#4e3623" opacity="0.5"/>
  <!-- strata bands -->
  <path d="M36 76 C70 84 130 84 164 74 L160 82 C128 90 72 90 40 82 Z" fill="#6e4a33" opacity="0.6"/>
  <path d="M62 96 C84 103 112 103 134 95 L130 102 C110 109 84 109 66 104 Z" fill="#54382a" opacity="0.5"/>
  <path d="M90 119 C96 123 103 123 108 119 L106 127 C100 130 95 129 92 126 Z" fill="#46301f" opacity="0.45"/>
  <!-- hanging roots -->
  <path d="M42 87 C37 95 33 104 30 113" stroke="#4e331f" stroke-width="1.6" fill="none" stroke-linecap="round"/>
  <path d="M97 141 C95 147 93 151 90 155" stroke="#4e331f" stroke-width="1.4" fill="none" stroke-linecap="round"/>
  <path d="M103 141 C105 146 107 150 110 153" stroke="#4e331f" stroke-width="1.4" fill="none" stroke-linecap="round"/>
  <!-- waterfall trickle off the right rim -->
  <path d="M172 66 C174 76 173 86 175 96 C176 102 174 107 175 112" stroke="url(#isl-fall)" stroke-width="3" fill="none" stroke-linecap="round"/>
  <circle cx="176" cy="114" r="3" fill="#cfeaff" opacity="0.55"/>

  <!-- grass cap: domed top overhanging the rock lip -->
  <path d="M14 62 C14 46 46 34 100 34 C154 34 186 46 186 62 C186 69 160 73 100 73 C40 73 14 69 14 62 Z" fill="url(#isl-grass)"/>
  <ellipse cx="76" cy="45" rx="52" ry="9" fill="#c4ee9d" opacity="0.5"/>
  <!-- tufts + fringe -->
  <g fill="#35824a">
    <path d="M38 47 l2 -6 l3 6 Z"/>
    <path d="M110 42 l2 -6 l3 6 Z"/>
    <path d="M158 50 l2 -5 l3 5 Z"/>
    <path d="M48 70 l3 5 l3 -5 Z"/>
    <path d="M128 72 l3 5 l3 -5 Z"/>
    <path d="M168 68 l3 5 l3 -5 Z"/>
  </g>
  <!-- spring flowers -->
  <circle cx="88" cy="48" r="1.4" fill="#ffe08a"/>
  <circle cx="146" cy="52" r="1.4" fill="#ffd0e0"/>

  <!-- small wooden dock jutting off the left rim -->
  <rect x="5" y="60" width="2.4" height="6" fill="#7a4e30"/>
  <rect x="14" y="60" width="2.4" height="5" fill="#7a4e30"/>
  <rect x="4" y="57" width="17" height="3.4" rx="1.2" fill="#a06a42"/>
  <rect x="4" y="57" width="17" height="1.2" rx="0.6" fill="#c98d5f"/>

  <!-- tiny cottage -->
  <rect x="57" y="31" width="18" height="13" rx="1" fill="#f3e2c0"/>
  <rect x="70" y="31" width="5" height="13" fill="#d9c49a"/>
  <path d="M53 31 L66 21 L79 31 Z" fill="url(#isl-roof)"/>
  <rect x="70" y="24" width="3.4" height="6" fill="#8a5a3c"/>
  <rect x="62" y="36" width="5" height="8" rx="1" fill="#5f3a22"/>
  <rect x="58.5" y="34" width="4" height="4" fill="#7ec8f0"/>

  <!-- windswept tree leaning right -->
  <path d="M127 51 C127 44 124 37 118 31 L122 29 C129 35 133 43 133 51 Z" fill="#7a4e30"/>
  <ellipse cx="136" cy="25" rx="13" ry="10" fill="url(#isl-leaf)"/>
  <ellipse cx="148" cy="29" rx="9" ry="7" fill="url(#isl-leaf)"/>
  <ellipse cx="126" cy="20" rx="8" ry="6" fill="url(#isl-leaf)"/>
  <ellipse cx="132" cy="21" rx="6" ry="4" fill="#a8e6a1" opacity="0.7"/>

  <!-- bushes -->
  <ellipse cx="42" cy="52" rx="9" ry="6" fill="#4fae62"/>
  <ellipse cx="50" cy="55" rx="7" ry="4.5" fill="#3f9a55"/>
  <ellipse cx="96" cy="55" rx="8" ry="5" fill="#4fae62"/>
  <ellipse cx="42" cy="50" rx="4" ry="2.5" fill="#8fd68f" opacity="0.8"/>

  <!-- pond feeding the waterfall -->
  <ellipse cx="172" cy="61" rx="7" ry="2.8" fill="#8fd0f0"/>
</svg>
