<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 160">
  <defs>
    <linearGradient id="isla-grass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a8e187"/>
      <stop offset="0.55" stop-color="#63bd72"/>
      <stop offset="1" stop-color="#3f9a55"/>
    </linearGradient>
    <linearGradient id="isla-rock" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#9c6f52"/>
      <stop offset="0.55" stop-color="#7d563c"/>
      <stop offset="1" stop-color="#5e3f2a"/>
    </linearGradient>
  </defs>

  <!-- faint lighthouse beam, behind everything -->
  <path d="M150 13 L196 4 L196 22 Z" fill="#ffe9a8" opacity="0.16"/>

  <!-- rocky underside: wider silhouette with two points -->
  <path d="M14 60 L186 60 L172 76 L158 84 L150 100 L145 114 L136 94 L122 87 L104 93 L92 112 L80 143 L71 117 L58 102 L40 92 L24 78 Z" fill="url(#isla-rock)"/>
  <!-- lit top-left facet / shaded right facet / shade beside main tip -->
  <path d="M14 60 L72 60 L80 84 L58 102 L40 92 L24 78 Z" fill="#c49b74" opacity="0.5"/>
  <path d="M186 60 L172 76 L158 84 L150 100 L145 114 L140 96 L148 80 L162 68 Z" fill="#4e3623" opacity="0.5"/>
  <path d="M104 93 L92 112 L80 143 L71 117 L58 102 L72 96 L88 100 Z" fill="#5a4030" opacity="0.35"/>
  <!-- strata bands -->
  <path d="M34 74 C66 82 120 82 164 72 L160 80 C120 88 68 88 38 80 Z" fill="#6e4a33" opacity="0.55"/>
  <path d="M96 102 C106 107 118 106 128 100 L126 108 C116 113 104 113 96 108 Z" fill="#54382a" opacity="0.5"/>
  <path d="M76 120 C80 124 84 123 86 119 L84 126 C81 128 78 127 76 125 Z" fill="#46301f" opacity="0.45"/>
  <!-- dangling roots + a broken-off shard -->
  <path d="M30 80 C26 88 24 96 22 102" stroke="#4e331f" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <path d="M44 94 C41 100 38 107 36 113" stroke="#4e331f" stroke-width="1.4" fill="none" stroke-linecap="round"/>
  <path d="M40 118 L50 114 L54 122 L46 128 Z" fill="#7d563c"/>
  <path d="M40 118 L50 114 L52 118 L43 121 Z" fill="#a2775a"/>

  <!-- grass cap: two rolling humps over a shared rim -->
  <ellipse cx="100" cy="62" rx="88" ry="12" fill="url(#isla-grass)"/>
  <ellipse cx="52" cy="51" rx="42" ry="13" fill="url(#isla-grass)"/>
  <ellipse cx="134" cy="48" rx="52" ry="15" fill="url(#isla-grass)"/>
  <ellipse cx="44" cy="46" rx="20" ry="5" fill="#c4ee9d" opacity="0.5"/>
  <ellipse cx="122" cy="41" rx="26" ry="6" fill="#c4ee9d" opacity="0.45"/>
  <!-- tufts + fringe -->
  <g fill="#35824a">
    <path d="M68 47 l2 -6 l3 6 Z"/>
    <path d="M100 51 l2 -6 l3 6 Z"/>
    <path d="M168 54 l2 -5 l3 5 Z"/>
    <path d="M30 66 l3 5 l3 -5 Z"/>
    <path d="M140 72 l3 5 l3 -5 Z"/>
  </g>

  <!-- lighthouse on the right hump -->
  <rect x="140" y="37" width="7" height="8" rx="3" fill="#54382a"/>
  <path d="M132 44 L136 18 L150 18 L154 44 Z" fill="#f6ead2"/>
  <path d="M134.3 25 L150.7 25 L151.6 30 L133.4 30 Z" fill="#e0702f"/>
  <path d="M132.7 34 L152.3 34 L153.1 39 L131.9 39 Z" fill="#e0702f"/>
  <path d="M144 18 L150 18 L154 44 L144 44 Z" fill="#a8683e" opacity="0.45"/>
  <rect x="130" y="17" width="26" height="2.6" rx="1" fill="#54382a"/>
  <rect x="137.5" y="9" width="12" height="8" fill="#ffe9a8" stroke="#54382a" stroke-width="1.4"/>
  <line x1="143.5" y1="9" x2="143.5" y2="17" stroke="#54382a" stroke-width="1"/>
  <path d="M135 9 C135 4.5 138 3.5 143.5 3.5 C149 3.5 152 4.5 152 9 Z" fill="#b3543a"/>
  <circle cx="143.5" cy="4" r="1.3" fill="#54382a"/>

  <!-- left hump: bushes + a tiny pine -->
  <path d="M61 49 L69 36 L77 49 Z" fill="#2f8a4c"/>
  <path d="M63 43 L69 33 L75 43 Z" fill="#3f9a55"/>
  <rect x="67.6" y="48" width="2.8" height="5" fill="#7a4e30"/>
  <ellipse cx="36" cy="52" rx="9" ry="6" fill="#4fae62"/>
  <ellipse cx="46" cy="55" rx="7" ry="4.5" fill="#3f9a55"/>
  <ellipse cx="34" cy="50" rx="4" ry="2.4" fill="#8fd68f" opacity="0.8"/>
</svg>
