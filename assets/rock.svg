<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <!-- silhouette base (in case of hairline facet seams) -->
  <path d="M10 66 L24 30 L56 14 L92 24 L110 50 L102 84 L72 106 L34 100 L12 80 Z" fill="#8a6b50"/>
  <!-- faceted faces, lit top-left grading to dark bottom-right -->
  <path d="M10 66 L24 30 L60 60 Z" fill="#b39272"/>
  <path d="M24 30 L56 14 L60 60 Z" fill="#c7a98a"/>
  <path d="M56 14 L92 24 L60 60 Z" fill="#a78a6a"/>
  <path d="M92 24 L110 50 L60 60 Z" fill="#8f7050"/>
  <path d="M110 50 L102 84 L60 60 Z" fill="#6b4e34"/>
  <path d="M102 84 L72 106 L60 60 Z" fill="#57402a"/>
  <path d="M72 106 L34 100 L60 60 Z" fill="#75563c"/>
  <path d="M34 100 L12 80 L60 60 Z" fill="#84664a"/>
  <path d="M12 80 L10 66 L60 60 Z" fill="#a08262"/>
  <!-- sunlit rim on the top-left edge -->
  <path d="M12 63 L24 31 L54 15" fill="none" stroke="#e4d0b8" stroke-width="2" stroke-linecap="round" opacity="0.75"/>
  <!-- cracks -->
  <path d="M56 16 L52 34 L58 50" fill="none" stroke="#3f2d1d" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M30 72 L44 76 L46 88" fill="none" stroke="#3f2d1d" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M88 60 L96 70" fill="none" stroke="#3f2d1d" stroke-width="1.4" stroke-linecap="round"/>
  <!-- moss patches -->
  <path d="M26 42 C24 35 29 29 36 29 C42 29 45 34 43 39 C41 44 32 47 26 42 Z" fill="#6aa25c"/>
  <circle cx="30" cy="34" r="1.6" fill="#548b49"/>
  <circle cx="38" cy="36" r="1.3" fill="#548b49"/>
  <path d="M15 80 C14 75 18 71 23 72 C27 73 28 78 25 81 C22 84 17 84 15 80 Z" fill="#639a55"/>
  <ellipse cx="84" cy="95" rx="6" ry="3.5" fill="#5d9350" opacity="0.85"/>
  <!-- grass tuft where it broke off an island -->
  <g fill="#4f9e55">
    <path d="M50 15 C49 10 46 8 43 6 C47 7 51 10 53 14 Z"/>
    <path d="M58 14 C58 9 60 6 63 4 C62 9 61 12 59 15 Z"/>
    <path d="M55 15 C55 10 54 8 53 5 C56 8 57 11 56 15 Z"/>
  </g>
</svg>
